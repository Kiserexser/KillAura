name: Build Mod JAR
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      
      - name: Build
        run: |
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.8-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          curl -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.8.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew 2>/dev/null || true
          echo "plugins { id 'fabric-loom' version '1.7.4' id 'java' } version = '1.0.0' group = 'com.swill.killaura' base { archivesName = 'killaura' } repositories { mavenCentral() maven { name = 'Fabric' url = 'https://maven.fabricmc.net/' } } dependencies { minecraft 'com.mojang:minecraft:1.20.4' mappings 'net.fabricmc:yarn:1.20.4+build.1:v2' modImplementation 'net.fabricmc:fabric-loader:0.15.11' modImplementation 'net.fabricmc.fabric-api:fabric-api:0.91.1+1.20.4' } java { sourceCompatibility = JavaVersion.VERSION_17 targetCompatibility = JavaVersion.VERSION_17 }" > build.gradle
          java -jar gradle/wrapper/gradle-wrapper.jar build --no-daemon
      
      - uses: actions/upload-artifact@v4
        with:
          name: KillAura-JAR
          path: build/libs/*.jar
